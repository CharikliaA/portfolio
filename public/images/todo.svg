<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ee"/>
      <stop offset="1" stop-color="#e2eafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e2a4a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="90" cy="330" r="110" fill="#cdb4db" opacity="0.35"/>
  <circle cx="720" cy="70" r="120" fill="#a2d2ff" opacity="0.35"/>

  <!-- Kort -->
  <rect x="200" y="40" width="400" height="320" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#1e2a4a">
    <text x="235" y="92" font-size="26" font-weight="700">Att göra</text>
    <text x="565" y="92" font-size="14" text-anchor="end" opacity="0.6">2 av 3 klara</text>

    <!-- Inmatning -->
    <rect x="235" y="115" width="280" height="44" rx="22" fill="#edf3fb" stroke="#d7e3fc" stroke-width="2"/>
    <text x="257" y="143" font-size="15" opacity="0.45">Ny uppgift...</text>
    <circle cx="543" cy="137" r="22" fill="#ffafcc"/>
    <path d="M543 128 v18 M534 137 h18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Rad 1 -->
    <circle cx="255" cy="195" r="12" fill="#ffafcc"/>
    <path d="M249 195 l4 4 l8 -8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="280" y="201" font-size="17" opacity="0.5">Plugga React</text>
    <line x1="280" y1="195" x2="383" y2="195" stroke="#1e2a4a" stroke-width="1.5" opacity="0.4"/>

    <line x1="235" y1="220" x2="565" y2="220" stroke="#edf3fb" stroke-width="2"/>

    <!-- Rad 2 -->
    <circle cx="255" cy="245" r="12" fill="#ffafcc"/>
    <path d="M249 245 l4 4 l8 -8" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="280" y="251" font-size="17" opacity="0.5">Handla mat</text>
    <line x1="280" y1="245" x2="368" y2="245" stroke="#1e2a4a" stroke-width="1.5" opacity="0.4"/>

    <line x1="235" y1="270" x2="565" y2="270" stroke="#edf3fb" stroke-width="2"/>

    <!-- Rad 3 -->
    <circle cx="255" cy="295" r="11" fill="none" stroke="#c1d3fe" stroke-width="2"/>
    <text x="280" y="301" font-size="17">Skicka LIA-ansökan</text>
  </g>
</svg>

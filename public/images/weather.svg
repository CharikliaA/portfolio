<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bde0fe"/>
      <stop offset="1" stop-color="#ffc8dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e2a4a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- Sol -->
  <circle cx="250" cy="170" r="110" fill="#ffffff" opacity="0.25"/>
  <circle cx="250" cy="170" r="80" fill="#ffc8dd" opacity="0.7"/>
  <circle cx="250" cy="170" r="58" fill="#ffafcc"/>

  <!-- Litet moln -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="380" cy="95" r="22"/>
    <circle cx="412" cy="82" r="30"/>
    <circle cx="446" cy="96" r="21"/>
    <rect x="358" y="95" width="110" height="26" rx="13"/>
  </g>

  <!-- Stort moln -->
  <g fill="#ffffff">
    <circle cx="170" cy="252" r="45"/>
    <circle cx="228" cy="225" r="62"/>
    <circle cx="292" cy="248" r="45"/>
    <rect x="125" y="248" width="212" height="50" rx="25"/>
  </g>

  <!-- Väderkort -->
  <rect x="480" y="70" width="250" height="260" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#1e2a4a">
    <text x="508" y="114" font-size="18" font-weight="600">Stockholm</text>
    <text x="504" y="190" font-size="64" font-weight="700">18°</text>
    <text x="508" y="222" font-size="16" opacity="0.65">Halvklart</text>

    <line x1="505" y1="244" x2="705" y2="244" stroke="#d7e3fc" stroke-width="2"/>

    <g font-size="13" text-anchor="middle" opacity="0.7">
      <text x="540" y="270">Mån</text>
      <text x="605" y="270">Tis</text>
      <text x="670" y="270">Ons</text>
    </g>

    <!-- Ikoner -->
    <circle cx="540" cy="290" r="7" fill="#ffafcc"/>
    <g fill="#bde0fe">
      <circle cx="600" cy="292" r="6"/>
      <circle cx="607" cy="288" r="8"/>
      <circle cx="614" cy="293" r="5"/>
      <rect x="595" y="291" width="22" height="7" rx="3.5"/>
    </g>
    <circle cx="670" cy="290" r="7" fill="#ffafcc"/>

    <g font-size="14" font-weight="600" text-anchor="middle">
      <text x="540" y="318">19°</text>
      <text x="605" y="318">16°</text>
      <text x="670" y="318">20°</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2eafc"/>
      <stop offset="1" stop-color="#f3e8f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e2a4a" flood-opacity="0.12"/>
    </filter>
    <polygon id="star" points="0,-10 2.65,-3.64 9.51,-3.09 4.28,1.39 5.88,8.09 0,4.5 -5.88,8.09 -4.28,1.39 -9.51,-3.09 -2.65,-3.64"/>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="80" cy="70" r="100" fill="#ffc8dd" opacity="0.35"/>
  <circle cx="760" cy="360" r="110" fill="#bde0fe" opacity="0.4"/>

  <!-- Stående böcker -->
  <rect x="150" y="95" width="55" height="110" rx="6" fill="#bde0fe"/>
  <rect x="163" y="115" width="29" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="163" y="180" width="29" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
  <rect x="210" y="112" width="48" height="93" rx="6" fill="#ffc8dd"/>
  <rect x="221" y="130" width="26" height="4" rx="2" fill="#ffffff" opacity="0.8"/>

  <!-- Liggande bokstapel -->
  <rect x="100" y="205" width="220" height="40" rx="6" fill="#ffafcc"/>
  <rect x="300" y="211" width="12" height="28" rx="2" fill="#ffffff" opacity="0.75"/>
  <rect x="125" y="245" width="200" height="40" rx="6" fill="#a2d2ff"/>
  <rect x="305" y="251" width="12" height="28" rx="2" fill="#ffffff" opacity="0.75"/>
  <rect x="110" y="285" width="230" height="40" rx="6" fill="#cdb4db"/>
  <rect x="320" y="291" width="12" height="28" rx="2" fill="#ffffff" opacity="0.75"/>

  <!-- Recensionskort -->
  <rect x="420" y="55" width="320" height="290" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#1e2a4a">
    <rect x="448" y="85" width="56" height="78" rx="8" fill="#ffafcc"/>
    <rect x="458" y="100" width="36" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <text x="520" y="110" font-size="18" font-weight="700">Ljuset i skogen</text>
    <text x="520" y="133" font-size="13" opacity="0.6">En roman</text>

    <g fill="#ffafcc">
      <use href="#star" x="530" y="152"/>
      <use href="#star" x="554" y="152"/>
      <use href="#star" x="578" y="152"/>
      <use href="#star" x="602" y="152"/>
    </g>
    <use href="#star" x="626" y="152" fill="#d7e3fc"/>

    <line x1="448" y1="185" x2="712" y2="185" stroke="#edf3fb" stroke-width="2"/>

    <text x="448" y="216" font-size="15">Riktigt fin läsning, svår att</text>
    <text x="448" y="238" font-size="15">lägga ifrån sig!</text>
    <text x="448" y="265" font-size="13" opacity="0.6">– Chariklia</text>

    <rect x="448" y="290" width="264" height="32" rx="16" fill="#edf3fb"/>
    <text x="580" y="311" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">GET /api/books/:id/reviews</text>
  </g>
</svg>
